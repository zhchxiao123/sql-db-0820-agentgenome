version: 2
module: sql-db-0820
environments:
  project:
    adapter: host.trusted
    options: {}
  host:
    adapter: host.trusted
    options: {}
gates:
- id: unit
  environment: project
  command:
    kind: argv
    argv:
    - make
    - test
    cwd: .
  provenance:
    origin: detector
    producer: makefile@1
    evidence:
    - kind: repository-entrypoint
      path: Makefile
      locator: target:test
      digest: sha256:eaa20b8e0ce6b89c0ab2c89b32377eea0fcdef141309f8af7bdc977435d7deba
  required: true
  timeout_s: 600
  parser: null
  junit_xml_path: null
- id: secrets
  environment: host
  command:
    kind: argv
    argv:
    - gitleaks
    - detect
    - --source
    - .
    - --no-banner
    - --no-git
    - --redact
    - --exit-code
    - '1'
    cwd: .
  provenance:
    origin: platform
    producer: agentgenome.secrets@1
    evidence:
    - kind: platform-policy
      path: ''
      locator: builtin:gitleaks-detect
      digest: builtin:agentgenome.secrets@1
  required: true
  timeout_s: 600
  parser: null
  junit_xml_path: null
